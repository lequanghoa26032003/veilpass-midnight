name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.23.0'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Compile Compact contract
        run: npm run compile

      - name: Run contract and privacy tests
        run: npm test

      - name: Type-check application
        run: npm run build

      - name: Build production frontend
        run: npm run web:build
